<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error — CineBook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="background:#0d1117;min-height:100vh;display:flex;align-items:center;justify-content:center">

<div class="text-center p-4">
    <div style="font-size:6rem;font-weight:900;background:linear-gradient(135deg,#e50914,#ff6b35);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1">
        {{ error_code or '404' }}
    </div>
    <h3 style="color:#fff;margin:16px 0 8px">{{ error_title or 'Page Not Found' }}</h3>
    <p style="color:var(--text-muted);max-width:400px;margin:0 auto 30px">
        {{ error_message or "The page you're looking for doesn't exist or has been moved." }}
    </p>
    <div class="d-flex gap-3 justify-content-center flex-wrap">
        <a href="/" class="btn btn-cinema">
            <i class="fas fa-home me-2"></i>Go Home
        </a>
        <button onclick="history.back()" class="btn btn-cinema-outline">
            <i class="fas fa-arrow-left me-2"></i>Go Back
        </button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
