{% extends 'user/base.html' %}
{% block title %}Change Password{% endblock %}

{% block content %}
<div style="background:#0d1117;min-height:calc(100vh - 70px);padding:60px 0">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="auth-card" style="max-width:100%;background:var(--card-bg);border:1px solid var(--border)">
                <div class="text-center mb-4">
                    <div style="width:60px;height:60px;background:rgba(217,108,44,0.1);border:1px solid rgba(217,108,44,0.3);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px">
                        <i class="fas fa-key" style="color:var(--orange);font-size:1.3rem"></i>
                    </div>
                    <h4 class="text-white mb-1">Change Password</h4>
                    <p class="text-white-50" style="font-size:0.875rem">Update your account password</p>
                </div>

                <form method="POST" action="{{ url_for('auth_bp.change_password') }}">
                    <div class="mb-3">
                        <label style="color:rgba(255,255,255,0.6);font-size:0.85rem">Current Password</label>
                        <div class="input-group">
                            <span class="input-group-text" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-right:none;color:#888">
                                <i class="fas fa-lock"></i>
                            </span>
                            <input type="password" name="current_password" id="curPwd" class="form-control" placeholder="Current password" required
                                   style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-left:none;border-right:none;color:#fff;border-radius:0">
                            <button type="button" class="input-group-text" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-left:none;color:#888;cursor:pointer"
                                    onclick="togglePassword('curPwd','curPwdIcon')">
                                <i class="fas fa-eye" id="curPwdIcon"></i>
                            </button>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label style="color:rgba(255,255,255,0.6);font-size:0.85rem">New Password</label>
                        <div class="input-group">
                            <span class="input-group-text" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-right:none;color:#888">
                                <i class="fas fa-lock-open"></i>
                            </span>
                            <input type="password" name="new_password" id="newPwd" class="form-control" placeholder="Min 6 characters" required minlength="6"
                                   style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-left:none;color:#fff">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label style="color:rgba(255,255,255,0.6);font-size:0.85rem">Confirm New Password</label>
                        <div class="input-group">
                            <span class="input-group-text" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-right:none;color:#888">
                                <i class="fas fa-lock"></i>
                            </span>
                            <input type="password" name="confirm_password" id="confPwd" class="form-control" placeholder="Re-enter new password" required
                                   style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-left:none;color:#fff">
                        </div>
                        <div id="chgMatch" style="font-size:0.75rem;margin-top:4px"></div>
                    </div>

                    <button type="submit" class="btn btn-auth text-white w-100">
                        <i class="fas fa-save me-2"></i>Update Password
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
</div>

<script>
document.getElementById('confPwd').addEventListener('input', function() {
    const match = this.value === document.getElementById('newPwd').value;
    const el = document.getElementById('chgMatch');
    el.innerHTML = this.value ? (match ? '<span style="color:#3fb950"><i class="fas fa-check me-1"></i>Passwords match</span>' : '<span style="color:#e50914"><i class="fas fa-times me-1"></i>Passwords do not match</span>') : '';
});
</script>
{% endblock %}
